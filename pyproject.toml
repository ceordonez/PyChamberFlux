[project]
name = "pychamberflux"
version = "0.2.0"
description = "Interactive floating chamber CH4 and CO2 fluxes (diffusive and ebullitive) from LGR analyser files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyghgaq>=0.1.5",
    "pyyaml",
    "xlsxwriter",
]

[tool.uv]
# Application run with `uv run main.py`, not an installable package
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import order
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# conftest sets the matplotlib backend before the other imports
"tests/conftest.py" = ["E402"]
"tests/test_fluxes.py" = ["E402"]
