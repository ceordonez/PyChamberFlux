#
# PATHS
# path_in is only where the file dialog opens; the LGR files are given when
# running: python main.py FILE_OR_FOLDER (or chosen in the dialog)
path_in: '/home/cesar/Dropbox/Cesar/PostDoc/Projects/Gambia/ONR/Data/2025/Raw/LGR'
path_out: '/home/cesar/Dropbox/Cesar/PostDoc/Projects/Gambia/ONR/Data/2025/Processed'
# path_out: './TEST'

# Site name, used in the output file names
site: 'Gambia'

# Chamber conditions and dimensions
Air:
  Temp: 30 # Air temperture in °C
  Pres: 1014 # Air pressure in hPa
Chamber:
  Volume: 16.76 # Volume in Liters
  Area: 0.126 # Area in (m2)
Plot:
  ylim_max: # CH4 axis of the selection plot
  ylim_min:

# Automatic pre-selection of the flux windows, to check on the plot.
# Remove a line to use its default.
Preselect:
  enabled: true
  gas: CO2           # gas used to find the deployments (CO2: not affected by CH4 bubbles)
  jump_threshold: 15 # break when the rate of change > 15 x noise (chamber placed/lifted)
  dead_time: 60      # s skipped after each break (chamber settling)
  end_margin: 5      # s skipped before each break
  min_duration: 120  # s, shortest window suggested
  min_r: 0.9         # minimum |Pearson r| of a suggested window

# CH4 bubbles inside a flux window. The jump of each bubble is removed before
# fitting the diffusive flux; ebullitive = sum of the jumps / duration.
Bubbles:
  enabled: true
  threshold: 10      # bubble when CH4 increases faster than 10 x noise
  before: 3          # s excluded before each bubble
  mixing_time: 20    # s excluded after each bubble (mixing in the chamber)
  jump_window: 60    # s before and after each bubble used to estimate its jump
